id: "module1_intro"
title: "Модуль 1 — Введение в компанию На Счастье"
description: "Приветственный модуль: культура компании, ценности и миссия"
roles: ["all"]
f_block: "F1"
products: ["P1", "P2", "P3", "P4", "P5"]
level: 1
estimated_duration_minutes: 45

lessons:
  - id: "m1_l1"
    title: "Добро пожаловать в На Счастье"
    type: "text"
    content: |
      Добро пожаловать в На Счастье! 
      
      Мы рады приветствовать вас в нашей команде. Эта обучающая система поможет вам узнать 
      всё необходимое о нашей компании, продуктах и процессах.
      
      Наша миссия:
      Приносить счастье и качество в каждое взаимодействие с клиентом. Мы верим, что 
      искренняя забота и внимание к деталям создают долгосрочные отношения.
      
      Наши ценности:
      - Клиент на первом месте: каждое решение начинается с потребностей клиента
      - Превосходство качества: мы никогда не идём на компромиссы в качестве
      - Командный дух: мы поддерживаем друг друга и растём вместе
      - Постоянное обучение: каждый день — возможность стать лучше
      
      Эта академия — ваш личный путеводитель к успеху в На Счастье. Не торопитесь, 
      изучайте каждый модуль внимательно и возвращайтесь к урокам при необходимости.
    duration_minutes: 15
    order: 1

  - id: "m1_l2"
    title: "История нашей компании"
    type: "text"
    content: |
      История На Счастье
      
      Основанная в 2020 году, компания На Счастье началась с простой идеи: относиться к 
      каждому клиенту как к члену семьи. То, что начиналось как небольшая команда из 5 
      увлечённых людей, выросло в процветающую компанию, обслуживающую тысячи довольных клиентов.
      
      Ключевые вехи:
      - 2020: Основание компании с фокусом на персонализированном обслуживании
      - 2021: Расширение на 3 новых города
      - 2022: Запуск нашей обучающей академии
      - 2023: Достигли отметки 10,000 довольных клиентов
      - 2024: Представили инновационную линейку продуктов
      - 2025: Продолжаем расти и служить с превосходством
      
      На протяжении всего нашего пути одно оставалось неизменным: наша приверженность 
      приносить счастье каждому, кому мы служим.
    duration_minutes: 15
    order: 2

  - id: "m1_l3"
    title: "Структура команды и роли"
    type: "text"
    content: |
      Понимание структуры нашей команды
      
      В компании На Счастье работают несколько ключевых отделов:
      
      Команда продаж (менеджеры):
      - Обрабатывают запросы клиентов и проводят консультации
      - Помогают клиентам выбрать наши продукты
      - Выстраивают долгосрочные отношения с клиентами
      
      Команда продакшена (генераторы):
      - Обеспечивают качество каждого продукта (песни, анимация, монтаж)
      - Управляют процессом создания контента
      - Поддерживают наши высокие стандарты
      
      Команда маркетинга:
      - Создают увлекательный контент
      - Управляют социальными сетями и кампаниями
      - Анализируют рыночные тенденции
      
      Команда поддержки:
      - Предоставляют помощь после продажи
      - Отвечают на вопросы и решают проблемы клиентов
      - Обеспечивают удовлетворённость клиентов
      
      Каждый играет важную роль в нашем успехе. Мы работаем как единая команда 
      с общей целью: счастье клиента.
    duration_minutes: 15
    order: 3

tests:
  - id: "m1_test1"
    title: "Тест по вводному модулю"
    passing_score: 70
    questions:
      - id: "q1"
        type: "single"
        question: "Какова основная миссия компании На Счастье?"
        options:
          - "Максимизировать прибыль любой ценой"
          - "Приносить счастье и качество в каждое взаимодействие с клиентом"
          - "Стать самой большой компанией в отрасли"
          - "Работать как можно быстрее"
        correct_index: 1

      - id: "q2"
        type: "single"
        question: "Что из перечисленного НЕ является нашей основной ценностью?"
        options:
          - "Клиент на первом месте"
          - "Превосходство качества"
          - "Срезание углов"
          - "Командный дух"
        correct_index: 2

      - id: "q3"
        type: "single"
        question: "Когда была основана компания На Счастье?"
        options:
          - "2018"
          - "2019"
          - "2020"
          - "2021"
        correct_index: 2

      - id: "q4"
        type: "single"
        question: "Какова роль команды продаж?"
        options:
          - "Управление инвентарём и логистикой"
          - "Создание увлекательного контента"
          - "Обработка запросов клиентов и построение отношений"
          - "Только техническая поддержка"
        correct_index: 2
