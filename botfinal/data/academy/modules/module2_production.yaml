lessons:
  - id: "m2_l1"
    title: "Качество — это всё"
    type: "text"
    content: |
      Качество: сердце компании На Счастье
      
      В компании На Счастье качество — это не просто цель, это то, кто мы есть. Каждый продукт, 
      каждое взаимодействие, каждая деталь отражает нашу приверженность превосходству.
      
      Почему качество важно:
      - Доверие клиента: качество строит долгосрочные отношения
      - Репутация бренда: наше имя означает превосходство
      - Гордость команды: мы гордимся тем, что создаём
      - Устойчивый рост: качество создаёт лояльных клиентов
      
      Наша философия качества:
      "Делай правильно с первого раза, каждый раз."
      
      Это означает:
      - Никогда не спешить ради сроков в ущерб качеству
      - Высказываться, когда видишь потенциальные проблемы
      - Брать ответственность за свою работу
      - Постоянное улучшение в каждом процессе
      
      Качество начинается с вас:
      Каждый член команды отвечает за качество. Независимо от того, работаете ли вы в продакшене, 
      на складе или в офисе, ваше внимание к деталям имеет значение.
      
      Помните: клиент может забыть, что мы сказали, но никогда не забудет, какие чувства вызвали 
      наши продукты. Давайте убедимся, что эти чувства всегда позитивные.
    duration_minutes: 20
    order: 1

  - id: "m2_l2"
    title: "Стандартные операционные процедуры (СОП)"
    type: "text"
    content: |
      Понимание наших СОП
      
      Стандартные операционные процедуры (СОП) — это основа стабильного качества. 
      Они гарантируют, что каждый продукт соответствует нашим стандартам, независимо от того, 
      кто его создаёт и когда.
      
      Зачем мы используем СОП:
      - Последовательность: одинаково высокое качество каждый раз
      - Обучение: чёткие руководства для всех
      - Эффективность: проверенные процессы экономят время
      - Контроль качества: легко обнаружить отклонения
      
      Ключевые производственные СОП:
      
      1. Приёмка и проверка материалов
         - Проверяйте все входящие материалы
         - Проверяйте качество по спецификациям
         - Немедленно документируйте любые проблемы
         - Храните правильно для поддержания качества
      
      2. Настройка производства
         - Очистите и подготовьте рабочее пространство
         - Соберите все необходимые материалы и инструменты
         - Изучите производственные спецификации
         - Дважды проверьте измерения и настройки
      
      3. Проверки качества в процессе
         - Регулярные проверки во время производства
         - Немедленное исправление любых проблем
         - Документирование всех проверок качества
         - Никогда не пропускайте шаги для экономии времени
      
      4. Финальная проверка
         - Заполните контрольный список качества
         - Визуальная и функциональная проверка
         - Проверка упаковки
         - Подпись инспектора по качеству
      
      5. Документация
         - Записывайте все производственные данные
         - Отмечайте любые отклонения или проблемы
         - Отслеживайте материалы и номера партий
         - Ведите чёткие, точные записи
      
      Соблюдение СОП НЕ является опциональным:
      - СОП разработаны на основе опыта и лучших практик
      - Пропуск шагов ставит качество под угрозу
      - Если вы считаете, что СОП нуждается в улучшении, предложите это — но следуйте ему до изменения
      - При сомнении всегда следуйте СОП и задавайте вопросы
      
      Помните: СОП защищают вас, защищают качество и защищают наших клиентов.
    duration_minutes: 30
    order: 2

  - id: "m2_l3"
    title: "Контрольные точки качества"
    type: "text"
    content: |
      Контроль качества: наша страховочная сеть
      
      Контроль качества (КК) — это наш систематический подход к обеспечению превосходства. 
      Через множество контрольных точек мы обнаруживаем и исправляем проблемы до того, 
      как они достигнут клиентов.
      
      Три линии защиты:
      
      1. Самопроверка (Первая линия)
         - Каждый член команды проверяет свою собственную работу
         - Обнаруживайте проблемы немедленно
         - Гордитесь личным качеством
         - Не передавайте проблемы дальше
      
      2. Проверка коллегами (Вторая линия)
         - Коллега проверяет вашу работу
         - Свежий взгляд замечает то, что вы могли пропустить
         - Командная ответственность
         - Возможность обучения для обеих сторон
      
      3. Инспектор КК (Третья линия)
         - Финальная независимая проверка
         - Использует стандартизированный контрольный список
         - Полномочия остановить отгрузку
         - Документирует все находки
      
      Распространённые контрольные точки качества:
      
      Качество материалов:
      - Визуальная проверка на дефекты
      - Проверка измерений
      - Постоянство цвета/текстуры
      - Проверка срока годности
      
      Качество производства:
      - Точность размеров
      - Проверка сборки
      - Функциональное тестирование
      - Качество отделки
      
      Качество упаковки:
      - Правильный продукт в правильной упаковке
      - Этикетки точные и правильно размещены
      - Упаковка неповреждённая
      - Все компоненты включены
      
      Когда вы находите проблему качества:
      
      1. СТОП: не продолжайте, если качество под угрозой
      2. ПОМЕТИТЬ: чётко отметьте предмет как "Удержать для проверки"
      3. СООБЩИТЬ: немедленно уведомите вашего руководителя
      4. ДОКУМЕНТИРОВАТЬ: запишите, что вы обнаружили и когда
      5. УЧИТЬСЯ: поймите первопричину, чтобы предотвратить повторение
      
      Стоимость проблем качества:
      - Переделка отнимает время и ресурсы
      - Возвраты вредят отношениям с клиентами
      - Отходы влияют на прибыльность
      - Репутация строится годами, разрушается за секунды
      
      Победы качества:
      Когда мы обнаруживаем проблему до отгрузки:
      - Доверие клиента сохраняется
      - Затраты минимизируются
      - Команда учится и улучшается
      - Все празднуют предотвращение проблемы
      
      Ваша роль:
      Вы — страж качества. Ваше внимание, усердие и приверженность превосходству 
      гарантируют, что каждый клиент получает опыт На Счастье, который он заслуживает.
      
      Помните: всегда лучше потратить дополнительную минуту на проверку качества, чем 
      часы на исправление проблем позже.
    duration_minutes: 25
    order: 3

