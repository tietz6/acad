id: "module3_sales_f1"
title: "Модуль 3 — Продажи (F1)"
description: "Реальные скрипты продаж песен 'На Счастье'. Продажи с душой, а не просто 'продажа услуги'. Обучение конкретной воронке, допродажам и работе с возражениями."
roles: ["sales_manager"]
f_block: "F1"
products: ["P1", "P2", "P3", "P4"]
level: 1
estimated_duration_minutes: 180

lessons:
  - id: "m3_l1"
    title: "Философия 'продаж без продаж': говорим с душой"
    type: "text"
    content: |
      Философия продаж в "На Счастье"
      
      ВАЖНО: Мы НЕ "продаём услугу". Мы помогаем людям создать особенные моменты и подарки.
      
      Наша философия — "Продажи с душой"
      
      Что это значит:
      □ Мы не используем слова "услуга", "покупка", "стоимость" на начальном этапе
      □ Мы говорим о чувствах, эмоциях, историях
      □ Мы создаём ожидание и вовлекаем клиента в процесс
      □ Мы искренне интересуемся историей клиента
      
      Основные принципы:
      
      1. Мягкость и теплота
         - Говорим естественно, как с другом
         - Используем эмодзи для передачи эмоций: 🥰💛✨🌸
         - Не торопим, не давим
      
      2. Фокус на человеке, а не на деньгах
         - Сначала узнаём историю
         - Потом предлагаем решение
         - Цена обсуждается после создания ценности
      
      3. Вовлечение в процесс
         - Клиент участвует в выборе текста
         - Клиент выбирает жанр и исполнителя
         - Клиент чувствует себя соавтором
      
      4. Создание ожидания
         - "Мы уже начинаем работать над вашей песней..."
         - "Подготовим два варианта, чтобы вы выбрали лучший..."
         - "Это будет невероятно..."
      
      5. Естественные допродажи
         - Не "продать больше", а "дать больше ценности"
         - Показываем, как два варианта = две разные эмоции
         - Объясняем выгоду акций через заботу, а не через скидку
      
      Что делать НЕЛЬЗЯ:
      ❌ "Наша услуга стоит..."
      ❌ "Хотите купить песню?"
      ❌ "Давайте закроем сделку"
      ❌ "Вы должны оплатить сейчас"
      
      Что делать НУЖНО:
      ✅ "Кому бы вы хотели подарить такую песню?"
      ✅ "Расскажите о вашей истории"
      ✅ "Это будет очень трогательно"
      ✅ "Можем начинать, если идея вам откликается"
      
      Помните: клиент должен чувствовать, что песня создаётся для него с душой, 
      а не по шаблону. Каждое слово имеет значение!
    duration_minutes: 20
    order: 1

  - id: "m3_l2"
    title: "Первое касание: как правильно открыть диалог"
    type: "text"
    content: |
      Первое касание — самый важный момент
      
      Цель первого сообщения:
      □ Создать тёплую атмосферу
      □ Показать искренний интерес к человеку
      □ НЕ говорить об "услуге" или "стоимости"
      
      ПРАВИЛЬНЫЙ скрипт первого касания:
      
      "Добрый день! 🥰
      Меня зовут [Ваше Имя]. Мы создаём уникальные песни по историям людей — не по шаблону, 
      а по живым чувствам.
      
      Буду рада помочь вам подарить песню, которая передаст самые тёплые эмоции 🌸
      
      Кому бы вы хотели подарить такую песню? 💫"
      
      Разбор формулировок:
      
      1. "Добрый день! 🥰" — тёплое приветствие с эмодзи
         → создаёт дружелюбную атмосферу
      
      2. "Меня зовут [Ваше Имя]" — представление
         → личный контакт, а не безликая компания
      
      3. "Мы создаём уникальные песни по историям людей"
         → не "продаём услугу", а "создаём что-то особенное"
      
      4. "не по шаблону, а по живым чувствам"
         → подчёркиваем уникальность и эмоции
      
      5. "Буду рада помочь вам подарить песню"
         → фокус на подарке, а не на покупке
      
      6. "Кому бы вы хотели подарить такую песню?"
         → открытый вопрос, вовлекающий в разговор
      
      АНТИПРИМЕРЫ (так делать НЕЛЬЗЯ):
      
      ❌ "Здравствуйте! У нас акция на песни, хотите купить?"
      → слишком прямолинейно, фокус на продаже
      
      ❌ "Добрый день! Наша услуга персонализированных песен стоит 1000 сом"
      → говорим о деньгах до создания ценности
      
      ❌ "Приветствую! Мы делаем песни на заказ. Интересно?"
      → сухо, без эмоций, безлично
      
      Что делать после первого ответа:
      
      Если клиент отвечает: "Хочу подарить маме"
      
      Ваш ответ:
      "Как прекрасно! 🌿 Мама — это самый родной человек. 
      Расскажите немного о ней — какая она, что любит? 
      Может, есть особенные моменты из вашей жизни вместе? 💛"
      
      → Продолжаем расспрашивать, показываем интерес
      
      Если клиент спрашивает: "А сколько это стоит?"
      
      Ваш ответ:
      "Конечно, обсудим все детали 😊 
      Но сначала давайте познакомимся с вашей историей — так песня получится максимально личной. 
      Для кого песня и по какому поводу? 🌸"
      
      → Мягко уводим от цены к истории
      
      Ключевые правила первого касания:
      
      1. Всегда тепло и с эмодзи (но не переборщите)
      2. Никогда не упоминайте деньги первыми
      3. Задавайте открытые вопросы
      4. Показывайте искренний интерес
      5. Реагируйте на ответы клиента эмоционально
      
      Помните: первое впечатление нельзя произвести дважды!
    duration_minutes: 25
    order: 2

  - id: "m3_l3"
    title: "Сбор истории: вопросы, реакции, создание эмоции"
    type: "text"
    content: |
      Сбор истории — основа персонализации
      
      Цель этого этапа:
      □ Узнать максимум деталей о получателе
      □ Понять эмоциональный контекст
      □ Собрать материал для текста песни
      □ Вовлечь клиента в процесс создания
      
      Основные вопросы для сбора истории:
      
      1. Про получателя:
         ✦ Как зовут человека, кому песня?
         ✦ Сколько лет? (возраст важен для стиля)
         ✦ Какой характер? (весёлый, серьёзный, романтичный)
      
      2. Про отношения:
         ✦ Кем вам приходится получатель? (мама, жена, друг)
         ✦ Сколько вы вместе? (для романтических песен)
         ✦ Как вы познакомились?
      
      3. Про особенные моменты:
         ✦ Какие моменты запомнились больше всего?
         ✦ Есть ли дети, питомцы, значимые события?
         ✦ Какие общие воспоминания?
      
      4. Про эмоции:
         ✦ Что бы вы хотели передать в песне?
         ✦ Какие чувства выразить? (благодарность, любовь, гордость)
         ✦ Что вы хотите, чтобы человек почувствовал?
      
      5. Про повод:
         ✦ По какому поводу песня? (день рождения, годовщина, просто так)
         ✦ Когда нужна песня? (срочность влияет на процесс)
      
      Пример правильного диалога:
      
      Клиент: "Хочу песню для жены на годовщину"
      
      Менеджер: "Как романтично! 🥹 Годовщина — особенный день.
      Расскажите, как зовут вашу жену?"
      
      Клиент: "Анна"
      
      Менеджер: "Прекрасное имя! ✨ Сколько лет вы вместе?"
      
      Клиент: "5 лет"
      
      Менеджер: "Как красиво... Пять лет — это уже целая история. 
      Расскажите, как вы познакомились? 💫"
      
      Клиент: "Встретились на концерте, она стояла рядом..."
      
      Менеджер: "Как трогательно! 🌸 Музыка вас и свела вместе. 
      Это будет чудесно отразить в песне. 
      А есть ли дети или питомцы, которые тоже часть вашей истории?"
      
      → Видите? Каждый ответ получает эмоциональную реакцию и новый вопрос
      
      ВАЖНО — Реагируйте эмоционально!
      
      После каждого ответа клиента используйте:
      
      ✦ "Как красиво..."
      ✦ "Как трогательно..."
      ✦ "Это будет чудесно в песне"
      ✦ "Какая прекрасная история"
      ✦ "Это так тепло..."
      ✦ "Я уже представляю, какой это будет текст"
      
      Эти реакции показывают, что вы:
      → Слушаете и слышите
      → Цените историю клиента
      → Искренне вовлечены в процесс
      
      Что делать, если клиент не может рассказать детали:
      
      Клиент: "Не знаю, что рассказать..."
      
      Менеджер: "Всё нормально, я помогу 😊
      Давайте по шагам. Представьте момент, когда вы были вместе и были счастливы. 
      Что вы делали? Где были?"
      
      → Помогайте наводящими вопросами
      
      Клиент: "Просто хочу сказать спасибо маме"
      
      Менеджер: "Это очень тепло 💛 
      За что конкретно хотели бы поблагодарить? 
      Может быть, вспомните моменты, когда она вас поддерживала?"
      
      → Углубляемся в эмоцию
      
      Когда завершать сбор истории:
      
      □ Собрано достаточно деталей для текста (5-7 ключевых фактов)
      □ Понятна эмоция, которую нужно передать
      □ Клиент вовлечён и вдохновлён
      □ Можете визуализировать, какой будет песня
      
      Переход к следующему этапу:
      
      "Спасибо, что поделились такой прекрасной историей! 🥰
      У меня уже есть представление, как это ляжет в текст песни.
      
      Сейчас расскажу, как мы будем работать дальше..."
      
      → Плавно переходим к объяснению процесса
      
      Помните: чем больше деталей, тем персональнее песня!
    duration_minutes: 25
    order: 3

  - id: "m3_l4"
    title: "Объяснение предоплаты без давления"
    type: "text"
    content: |
      Как правильно объяснить предоплату
      
      Момент говорить о деньгах наступает ПОСЛЕ:
      □ Собрана история
      □ Создана эмоциональная связь
      □ Клиент вовлечён в процесс
      
      Цель: объяснить предоплату мягко и уверенно, без давления
      
      ПРАВИЛЬНЫЙ скрипт объяснения предоплаты:
      
      "Заранее уточню 💛 — мы работаем по предоплате, так как всё создаётся с нуля, индивидуально.
      
      После оплаты вы получите два текста на выбор, а затем — два демо.
      Мы вместе выберем финальный вариант, и вы получите полную песню высокого качества 🎧"
      
      Разбор формулировки:
      
      1. "Заранее уточню 💛"
         → Предупреждаем мягко, не резко
      
      2. "мы работаем по предоплате"
         → Факт, а не просьба. Это стандарт, а не исключение
      
      3. "так как всё создаётся с нуля, индивидуально"
         → Объяснение причины (логика, а не жадность)
      
      4. "После оплаты вы получите..."
         → Показываем, что клиент получает за деньги
      
      5. "два текста... два демо"
         → Подчёркиваем ценность (не один, а два варианта!)
      
      6. "Мы вместе выберем"
         → Клиент участвует, это совместная работа
      
      7. "полную песню высокого качества"
         → Финальная ценность
      
      Работа с возражениями по оплате:
      
      Возражение 1: "А можно сначала послушать?"
      
      Ответ:
      "Понимаю ваше желание 😊 
      К сожалению, каждая песня уникальна и создаётся под конкретного человека, 
      поэтому мы не можем сделать её заранее.
      
      Но мы гарантируем, что будем работать с вами на каждом этапе:
      → Согласуем текст
      → Согласуем демо
      → Внесём правки, если нужно
      
      Вы будете видеть процесс и участвовать в нём 🌸"
      
      Возражение 2: "А если мне не понравится?"
      
      Ответ:
      "Отличный вопрос! 💛
      Именно поэтому мы делаем два варианта текста и два демо — 
      чтобы у вас был выбор.
      
      На каждом этапе мы запрашиваем ваше мнение и вносим правки.
      Мы работаем до тех пор, пока вы не будете довольны результатом.
      
      Наша цель — чтобы песня стала идеальным подарком 🥰"
      
      Возражение 3: "Это дорого"
      
      Ответ:
      "Я понимаю 😊 Давайте посмотрим на это с другой стороны.
      
      Это не просто песня — это уникальный подарок, который будут слушать годами.
      Представьте реакцию [имя получателя], когда услышит песню про себя, 
      со своим именем и вашей историей 🥹
      
      Такие моменты бесценны. А мы вкладываем душу в каждую песню.
      
      Плюс, мы можем обсудить варианты — например, одна песня или пакет. 
      При пакете из трёх песен — четвёртая в подарок 🎁"
      
      → Мягко переводим на ценность и допродажу
      
      Возражение 4: "Мне нужно подумать"
      
      Ответ:
      "Конечно, это абсолютно нормально 🌿
      Это важное решение, и стоит подумать.
      
      Если у вас появятся вопросы или захотите что-то уточнить — пишите в любое время.
      Я всегда на связи 💛
      
      Кстати, если вы решите заказать до [дата] — успеем подготовить к [событие].
      Буду рада помочь!"
      
      → Оставляем дверь открытой + мягкий дедлайн
      
      Когда НЕ нужно настаивать:
      
      Если клиент говорит:
      → "Нет, спасибо" (прямой отказ)
      → "Это не для меня"
      → "Слишком дорого, не потяну"
      
      Ваш ответ:
      "Понимаю, спасибо за ваше время 🌸
      Если вдруг передумаете или захотите узнать больше — обращайтесь!
      Всегда рады помочь 😊"
      
      → Заканчиваем на позитивной ноте, без давления
      
      Переход к оплате (если клиент согласен):
      
      "Если идея вам откликается — можем начинать 🥰
      Песня будет готова примерно за [срок].
      
      Можно внести предоплату или полную оплату — как удобнее 💳
      После оплаты сразу запускаем процесс 🎶"
      
      Помните: мы не "выбиваем" деньги, мы предлагаем ценность!
    duration_minutes: 30
    order: 4

  - id: "m3_l5"
    title: "Отправка текстов: два варианта + допродажа двух исполнений"
    type: "text"
    content: |
      Отправка текстов — момент для допродажи
      
      После оплаты мы готовим два варианта текста. Это НЕ просто выбор — это основа для допродажи!
      
      Скрипт ПОДОГРЕВА перед отправкой текстов:
      
      "Прекрасно! Если хотите ещё что-то добавить — пишите. 
      Мы уже потихоньку приступаем к написанию текста песни для вас. 
      
      Подготовим сразу два варианта, чтобы вы выбрали наилучший. 
      А после утверждения текста и жанра — исполним для вас в двух версиях, 
      чтобы вам было максимально приятно ❤️❤️🥹"
      
      → Это создаёт ожидание двух вариантов на каждом этапе
      
      Скрипт ОТПРАВКИ двух текстов:
      
      "Два варианта текста по вашей истории получились прекрасными 🥹✨
      
      [Текст 1]
      
      [Текст 2]
      
      Один вариант, по моему мнению, отлично прозвучит в жанре романтики — 
      он нежный, чувственный.
      
      А второй вариант прекрасно ляжет в более современный поп-формат — 
      он живой и эмоциональный.
      
      Если хотите, можем исполнить оба текста в двух разных стилях — 
      чтобы у вас были два совершенно разных настроения 🎶
      
      И чтобы вам тоже было приятно, сделаем хорошую скидку за два исполнения 💛"
      
      Разбор допродажи:
      
      1. "Два варианта текста получились прекрасными"
         → Хвалим оба текста (не "один лучше другого")
      
      2. "Один вариант отлично прозвучит в жанре романтики"
         → Показываем уникальность первого варианта
      
      3. "А второй вариант прекрасно ляжет в поп-формат"
         → Показываем уникальность второго варианта
      
      4. "можем исполнить оба текста в двух разных стилях"
         → Предложение без давления ("если хотите")
      
      5. "два совершенно разных настроения"
         → Подчёркиваем ценность = две разные эмоции
      
      6. "сделаем хорошую скидку"
         → Мягкий стимул, без конкретной цифры
      
      Что это даёт:
      
      ✦ Создаёт ощущение уникальности каждой версии
      ✦ Показывает разницу в жанрах = повод взять два
      ✦ Усиливает ценность "двух эмоций в одном подарке"
      ✦ Позволяет гладко перейти к апсейлу, не давя
      
      Работа с возражениями:
      
      Возражение 1: "Мне хватит одного варианта"
      
      Ответ:
      "Конечно, понимаю 😊
      Просто клиенты часто берут оба, потому что:
      → Одну песню можно подарить сейчас
      → Вторую — на другой праздник или другому человеку
      
      Плюс, два разных жанра — это два совершенно разных настроения.
      Но решение за вами, я просто хотела предложить 💛"
      
      Возражение 2: "Сколько будет стоить второй вариант?"
      
      Ответ:
      "Отличный вопрос! 
      Обычно вторая песня стоит [цена], но для вас сделаем [цена со скидкой].
      
      Фактически, вы получите два уникальных подарка по цене полутора 🎁"
      
      Возражение 3: "Я подумаю"
      
      Ответ:
      "Конечно, без проблем 🌿
      Давайте сначала выберем один текст и сделаем демо.
      
      После демо вы сами услышите, и, возможно, захотите и второй вариант.
      Это всегда можно добавить 💛"
      
      → Не настаиваем, но оставляем возможность
      
      Если клиент выбрал ОДИН текст:
      
      "Прекрасный выбор! ✨
      Какой жанр вам ближе для этого текста? 
      И кому исполнить — мужчине или девушке? 🎶"
      
      → Двигаемся дальше без давления
      
      Если клиент выбрал ДВА текста:
      
      "Замечательно! 🥰 Это будет невероятно!
      
      Давайте определим жанры:
      → Для первого текста какой стиль? (романтика, поп, акустика)
      → Для второго текста? 
      
      И кому исполнить каждый — мужчине или девушке?"
      
      → Радуемся и помогаем с выбором
      
      Переход к демо:
      
      "Отлично! Я передаю всё нашим мастерам.
      Совсем скоро у вас будут демо-версии 🎧
      
      Это будет прекрасно, обещаю! 💫"
      
      Помните: мы не "впариваем" два варианта, мы показываем их ценность!
      Если клиент берёт один — отлично. Если два — ещё лучше!
    duration_minutes: 30
    order: 5

  - id: "m3_l6"
    title: "Демо и допродажа второго варианта"
    type: "text"
    content: |
      Отправка демо — второй шанс на допродажу
      
      После создания демо-версий у вас есть ещё один шанс предложить клиенту взять два варианта.
      
      Скрипт отправки ОДНОГО демо (если клиент выбрал один текст):
      
      "Вот демо вашей песни! 🎧✨
      
      [аудио]
      
      Послушайте и скажите, что думаете.
      Если хотите что-то скорректировать — всегда можем внести правки 💛"
      
      → Просто отправляем и ждём реакции
      
      Скрипт отправки ДВУХ демо (допродажа!):
      
      "Эти варианты получились невероятными! 🥹✨
      
      [демо 1]
      [демо 2]
      
      Честно, когда я слушала их перед отправкой вам — сама не могла выбрать лучший. 
      
      Зная себя, я бы переслушивала одну версию, пока не надоест, 
      а потом включала вторую — и снова новые эмоции 🥹✨
      
      Может, возьмёте сразу оба? 
      Одну можно подарить сейчас, а другую — в другой день. 
      Это будет вдвойне ценно.
      
      А чтобы вам было приятно, сделаем хорошую скидочку на второй вариант 💛"
      
      Разбор допродажи:
      
      1. "Эти варианты получились невероятными!"
         → Восхищаемся обоими вариантами
      
      2. "я слушала их... сама не могла выбрать лучший"
         → Личное мнение, показываем, что оба хороши
      
      3. "переслушивала одну версию... потом включала вторую"
         → Визуализация использования двух вариантов
      
      4. "и снова новые эмоции"
         → Подчёркиваем ценность = разные эмоции
      
      5. "Может, возьмёте сразу оба?"
         → Мягкое предложение, без давления
      
      6. "Одну можно подарить сейчас, а другую — в другой день"
         → Практическая выгода
      
      7. "сделаем хорошую скидочку"
         → Стимул без конкретной цифры
      
      Работа с возражениями:
      
      Возражение 1: "Мне нужен только один вариант"
      
      Ответ:
      "Понимаю 😊 Какой вам больше откликается?
      
      Кстати, если вдруг передумаете и захотите второй — 
      мы всегда можем его доделать. Просто скажите 💛"
      
      → Закрываем тему, но оставляем дверь открытой
      
      Возражение 2: "Сколько будет второй вариант?"
      
      Ответ:
      "Второй вариант обычно [полная цена], 
      но для вас сделаем [цена со скидкой 30-40%].
      
      Это реально выгодно, потому что вы получите два готовых подарка 🎁"
      
      Возражение 3: "Зачем мне два варианта?"
      
      Ответ:
      "Отличный вопрос! 😊
      Представьте: одну песню вы дарите на [текущий повод], 
      а вторую — на следующий праздник или другому человеку.
      
      Например, если эта песня для мамы — вторую можно подарить папе или сестре.
      Или просто иметь про запас — это удобно и экономит время в будущем 🌸"
      
      Возражение 4: "Я подумаю"
      
      Ответ:
      "Конечно, думайте спокойно 🌿
      
      Просто имейте в виду: если решите позже, тогда будет полная цена.
      А сейчас — специальная скидка, потому что мы уже работали над обоими вариантами 💛
      
      Но решение за вами, без давления!"
      
      → Мягкий дедлайн, но без агрессии
      
      Если клиент берёт ОБА варианта:
      
      "Ура! 🥰 Это будет невероятно!
      Сейчас доведём оба до идеала и отправим вам финальные версии.
      
      Это лучшее решение — у вас будет два уникальных подарка! 🎁✨"
      
      Если клиент берёт ОДИН вариант:
      
      "Отлично! Какой вариант выбираете? 💛"
      
      Клиент: "Первый"
      
      "Прекрасный выбор! ✨ 
      Доведём его до совершенства и отправим финальную версию.
      Это будет шикарный подарок! 🎶"
      
      → Радуемся выбору, не показываем разочарования
      
      Переход к финалу:
      
      "Финальную версию получите в течение [срок].
      Если будут вопросы — всегда на связи 💛"
      
      Помните: если клиент не берёт второй вариант — это нормально!
      Главное — оставить позитивное впечатление для будущих заказов.
    duration_minutes: 30
    order: 6

  - id: "m3_l7"
    title: "Воронка '2 песни → 4 песни': логика акции и работа с возражениями"
    type: "text"
    content: |
      Акция "3 песни — 4-я в подарок"
      
      Эта воронка работает для клиентов, которые УЖЕ заказали 2 песни.
      
      Цель: предложить акцию "3+1" (три песни — четвёртая бесплатно)
      
      Когда применять:
      
      □ Клиент уже оплатил 2 песни (или заказывает вторую)
      □ Клиент доволен процессом и качеством
      □ Клиент не говорил категорично "мне больше не нужно"
      
      Скрипт предложения акции:
      
      "🌸 Кстати, вы уже заказали две песни, и это очень здорово! 
      
      У нас клиенты часто на этом этапе берут ещё одну, потому что у нас действует акция: 
      при заказе трёх песен — четвёртая абсолютно бесплатно 🎁
      
      Фактически вы уже на полпути — стоит добавить одну, 
      и у вас будет сразу четыре готовых подарка ✨"
      
      Разбор скрипта:
      
      1. "вы уже заказали две песни, и это очень здорово!"
         → Признание достижения клиента
      
      2. "клиенты часто на этом этапе берут ещё одну"
         → Социальное доказательство (другие так делают)
      
      3. "при заказе трёх песен — четвёртая бесплатно"
         → Чёткое условие акции
      
      4. "Фактически вы уже на полпути"
         → Показываем близость к цели
      
      5. "четыре готовых подарка"
         → Визуализация выгоды
      
      Формула выгоды (пример для объяснения):
      
      1 песня = 1000 сом
      2 песни = 2000 сом
      3 песни = 3000 сом
      4-я БЕСПЛАТНО → итого 4 песни за 3000 сом
      
      Выгода: 4 песни по цене 3 = экономия 1000 сом!
      
      Как объяснить выгоду клиенту:
      
      "Смотрите, как это работает:
      
      Вы уже заказали 2 песни = [2000 сом]
      Добавляете ещё одну = ещё [1000 сом]
      И получаете четвёртую совершенно бесплатно!
      
      Итого: 4 песни за [3000 сом] вместо [4000 сом].
      Это реально выгодно 💛"
      
      Работа с возражениями:
      
      Возражение 1: "Зачем мне ещё песни? Я же уже две взял(а)"
      
      Ответ:
      "Понимаю 😊 Просто это удобно:
      
      Четвёртая у вас будет как готовый подарок на будущее — 
      например, маме, детям или к юбилею.
      
      Представьте: праздник приближается, а у вас уже есть идеальный подарок, 
      созданный заранее 🌟
      
      И вы за это не платите — экономите реально."
      
      Возражение 2: "Я подумаю позже"
      
      Ответ:
      "Конечно, без проблем 🌿
      
      Но сразу скажу: акция работает только при едином заказе.
      Если позже решите, тогда каждая песня будет отдельно по обычной цене.
      
      А сейчас у вас шанс взять сразу четыре за цену трёх, и это реально выгодно."
      
      → Мягкий дедлайн без агрессии
      
      Возражение 3: "У меня нет денег на ещё одну"
      
      Ответ:
      "Понимаю 💛 Бюджет — это важно.
      
      Просто имейте в виду: вы платите за три, а получаете четыре.
      Это не 'ещё одна дорогая покупка', а выгодное вложение.
      
      Но если сейчас не получается — всегда можно заказать потом, 
      просто тогда будет обычная цена."
      
      → Показываем выгоду, но не давим
      
      Возражение 4: "Мне некому дарить четыре песни"
      
      Ответ:
      "Это нормально 😊 
      Но песни не обязательно дарить прямо сейчас.
      
      Подумайте:
      → Мама, папа, бабушка, дедушка
      → Муж/жена, дети
      → Лучший друг, подруга
      → Коллега, начальник
      → Можно даже себе заказать — память о себе
      
      Плюс, впереди много праздников: Новый год, дни рождения, 8 марта...
      У вас просто будет готовый запас уникальных подарков 🎁"
      
      Возражение 5: "Я не хочу заморачиваться с ещё двумя песнями"
      
      Ответ:
      "Понимаю, не хочется усложнять 😊
      
      Но вы можете заказать сейчас, а историю для третьей и четвёртой песни 
      прислать позже — когда будет удобно.
      
      Мы зафиксируем вашу акцию, и вы сможете использовать её в любой момент 💛"
      
      → Снимаем барьер "сейчас надо всё придумывать"
      
      Когда НЕ предлагать акцию:
      
      ❌ Клиент уже сказал "мне больше не нужно"
      ❌ Клиент недоволен качеством
      ❌ Клиент жаловался на цену
      ❌ Клиент находится в сложной финансовой ситуации
      
      → В этих случаях лучше не настаивать
      
      Если клиент соглашается:
      
      "Замечательно! 🥰 Это отличное решение!
      
      Давайте определимся:
      → Для кого третья песня?
      → Для кого четвёртая?
      → Или можем оставить четвёртую 'про запас' — решите позже.
      
      Я оформлю всё и мы начнём работу! ✨"
      
      Если клиент отказывается:
      
      "Понимаю, спасибо, что выслушали предложение 🌸
      
      Если вдруг передумаете — дайте знать, пока акция действует.
      А пока продолжаем работать над вашими двумя песнями 💛"
      
      → Закрываем тему без давления
      
      Помните: акция "3+1" — это реальная выгода для клиента.
      Мы не "впариваем", мы предлагаем сэкономить!
    duration_minutes: 30
    order: 7

  - id: "m3_l8"
    title: "Завершение: тёплое послевкусие + мягкое напоминание про допзаказ"
    type: "text"
    content: |
      Завершение продажи — основа для будущих заказов
      
      Цель финального этапа:
      □ Оставить тёплое впечатление
      □ Получить обратную связь / отзыв
      □ Мягко напомнить про возможность допзаказа
      □ Подготовить почву для возврата клиента
      
      Скрипт отправки финальной песни:
      
      "Вот и готова ваша песня! 🎶✨
      
      [финальный аудиофайл]
      
      Мы вложили в неё душу, и надеемся, что она передаст все те эмоции, 
      которые вы хотели выразить 💛
      
      Послушайте и расскажите, что чувствуете 🥰"
      
      → Отправляем с теплотой и ждём реакции
      
      Реакция на отзыв клиента:
      
      Клиент: "Спасибо, очень красиво!"
      
      Ответ:
      "Ура! 🥰 Так рада, что вам понравилось!
      Это была прекрасная история, и мы с удовольствием работали над ней.
      
      Пусть эта песня станет тем самым моментом, который останется в сердце 🌿"
      
      Клиент: "Плачу, это так трогательно..."
      
      Ответ:
      "Ооо, это так трогательно! 🥹💛
      Значит, мы попали прямо в сердце. Это и есть наша цель.
      
      Пусть эта песня дарит тепло и радость снова и снова ✨"
      
      Клиент: "Можно немного изменить?"
      
      Ответ:
      "Конечно! 😊 Скажите, что именно хотелось бы подкорректировать?
      Мы внесём правки и отправим обновлённую версию 💛"
      
      → Реагируем на любой фидбэк позитивно
      
      Просьба об отзыве (мягко):
      
      "Кстати, если вам не сложно, будем очень благодарны за отзыв 🌸
      
      Это поможет другим людям узнать о нас и тоже создать особенные подарки.
      Можно оставить отзыв [тут ссылка] или просто прислать пару слов сюда — 
      как вам удобнее 💛"
      
      → Просим отзыв после позитивной реакции
      
      Мягкое напоминание про допзаказ:
      
      "🎁 Кстати, при заказе трёх песен — четвёртая в подарок.
      
      Можно сделать ещё одну — для мамы, ребёнка или просто 'для себя'.
      Впереди много праздников, и готовый подарок всегда под рукой ✨
      
      Если заинтересует — пишите, всегда рады помочь 🥰"
      
      → Мягко напоминаем, не настаиваем
      
      Финальное сообщение:
      
      "Спасибо за доверие 🙌
      Было очень приятно работать с вами и вашей историей.
      
      Если понадобится ещё песня или другой подарок 
      (у нас есть фото-анимации, видео, мультфильмы для детей) — 
      обращайтесь в любое время 💛
      
      Пусть ваши близкие будут счастливы! 🌸"
      
      Что делать после завершения:
      
      1. Сохранить контакт клиента
         → Добавить в базу для будущих акций
      
      2. Отметить предпочтения клиента
         → Какой стиль выбрал, для кого заказывал
      
      3. Запланировать follow-up через 1-2 месяца
         → "Привет! Как дела? Как отреагировал получатель на песню? 😊"
      
      4. Отправить напоминание перед праздниками
         → "Скоро 8 марта / Новый год — если захотите ещё подарков, мы тут 💛"
      
      Работа с недовольством (если клиент не в восторге):
      
      Клиент: "Это не то, что я ожидал(а)"
      
      Ответ:
      "Мне очень жаль, что не попали в ожидания 😔
      
      Давайте разберёмся: что конкретно не подошло? 
      Мы обязательно переделаем и доведём до идеала.
      
      Для нас важно, чтобы вы были довольны 💛"
      
      → Не защищаемся, а предлагаем решение
      
      Клиент: "Качество не то"
      
      Ответ:
      "Очень жаль слышать это 😔
      
      Можете уточнить, что именно не устраивает по качеству? 
      Звук, голос, текст? Мы переделаем бесплатно.
      
      Наша цель — чтобы вы получили идеальный результат 🌸"
      
      → Берём ответственность и исправляем
      
      Золотые правила завершения:
      
      1. Всегда оставляем позитивное впечатление
      2. Благодарим за доверие
      3. Мягко напоминаем про другие продукты / акции
      4. Оставляем дверь открытой для будущих заказов
      5. Не исчезаем после оплаты — остаёмся на связи
      
      Помните: довольный клиент вернётся и приведёт друзей!
      Недовольный клиент — это упущенная возможность и плохая репутация.
      
      Поэтому финал должен быть безупречным 🌟
    duration_minutes: 25
    order: 8

