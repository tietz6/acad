id: "module3_sales_f1"
title: "Модуль 3 — Продажи (F1)"
description: "Как мы продаём с теплотой и без давления. Овладейте искусством консультативных продаж."
roles: ["sales_manager"]
f_block: "F1"
products: ["P1", "P2", "P3", "P4"]
level: 1
estimated_duration_minutes: 90

lessons:
  - id: "m3_l1"
    title: "Воронка продаж S0–S9"
    type: "text"
    content: |
      Понимание нашей воронки продаж
      
      В компании На Счастье мы используем структурированную воронку продаж для сопровождения 
      клиентов через их путь. Каждый этап разработан для построения доверия и предоставления ценности.
      
      Этапы продаж:
      
      S0 - Лид создан: новый потенциальный клиент попадает в нашу систему
      - Идентифицирован источник (сайт, рекомендация, соцсети)
      - Собрана базовая контактная информация
      - Отмечен первоначальный интерес
      
      S1 - Первый контакт: начальная коммуникация с лидом
      - Дружеское знакомство с На Счастье
      - Понимание потребностей клиента
      - Установка ожиданий для следующих шагов
      
      S2 - Оценка потребностей: глубокое погружение в требования клиента
      - Активное слушание для понимания болевых точек
      - Задавание уточняющих вопросов
      - Определение наилучшего решения
      
      S3 - Презентация решения: показываем, как мы можем помочь
      - Индивидуальные рекомендации продуктов
      - Демонстрация характеристик и преимуществ
      - Решение конкретных выявленных потребностей
      
      S4 - Отправлено предложение: формальное предложение доставлено
      - Детальное ценообразование и опции
      - Чёткие условия и положения
      - График для принятия решения
      
      S5 - Переговоры: проработка деталей
      - Решение вопросов и опасений
      - Поиск взаимовыгодных условий
      - Построение уверенности в партнёрстве
      
      S6 - Контракт подписан: соглашение финализировано
      - Юридические документы завершены
      - Подтверждены условия оплаты
      - Начинается процесс адаптации
      
      S7 - Доставка/Реализация: решение доставлено
      - Продукт/услуга предоставлены как обещано
      - Завершены проверки качества
      - Клиент обучен при необходимости
      
      S8 - Последующие действия: обеспечение удовлетворённости
      - Связь с клиентом
      - Решение любых проблем
      - Построение отношений для будущего бизнеса
      
      S9 - Закрыто/Выиграно: успешное завершение
      - Клиент доволен и активен
      - Потенциал для допродаж/кросс-продаж
      - Выявлены возможности для рекомендаций
      
      Помните: не каждый лид достигает S9, и это нормально. Наша цель — предоставлять 
      ценность на каждом этапе и поддерживать позитивные отношения, даже если продажа не закрывается.
    duration_minutes: 30
    order: 1

  - id: "m3_l2"
    title: "Скрипт первого контакта"
    type: "text"
    content: |
      Искусство первого контакта
      
      Ваше первое взаимодействие с клиентом задаёт тон всем отношениям. 
      Вот наш подход к тому, чтобы сделать его тёплым, профессиональным и эффективным.
      
      Золотые правила:
      1. Будьте искренне заинтересованы в помощи
      2. Слушайте больше, чем говорите
      3. Никогда не давите и не торопите клиента
      4. Всегда оставляйте клиента с позитивным ощущением о На Счастье
      
      Пример открывающего скрипта:
      
      "Здравствуйте, [Имя Клиента], это [Ваше Имя] из компании На Счастье! 
      
      Я заметил, что вы проявили интерес к [конкретному продукту/услуге]. Я хотел 
      лично связаться с вами, чтобы узнать, как я могу помочь.
      
      У вас есть несколько минут для разговора? Если нет, я буду рад запланировать 
      время, которое вам подходит."
      
      Ключевой поток разговора:
      
      1. Представление (30 секунд)
         - Ваше имя и роль
         - Представление компании
         - Подтверждение их интереса
      
      2. Разрешение продолжить (15 секунд)
         - Проверьте, удобно ли время
         - Покажите уважение к их времени
         - Предложите гибкость
      
      3. Вопросы для выявления потребностей (3-5 минут)
         - "Что побудило ваш интерес к [продукту/услуге]?"
         - "Чего вы надеетесь достичь?"
         - "Работали ли вы с похожими решениями раньше?"
         - "Что для вас наиболее важно при принятии этого решения?"
      
      4. Заявление о ценности (1-2 минуты)
         - Краткий обзор того, как мы можем помочь
         - Подчёркивание релевантных преимуществ
         - Поделитесь быстрой историей успеха, если релевантно
      
      5. Следующие шаги (1 минута)
         - Предложите чёткие пункты действий
         - Установите ожидания для последующих действий
         - Предоставьте вашу контактную информацию
      
      Пример закрытия:
      
      "Большое спасибо за ваше время сегодня, [Имя Клиента]. Основываясь на том, что вы 
      поделились, я думаю, мы действительно можем помочь вам с [конкретной потребностью]. 
      
      Я отправлю вам [конкретный ресурс/предложение] к [конкретной дате], и давайте 
      запланируем связаться снова [предложенная дата] для дальнейшего обсуждения.
      
      Это вам подходит? И, пожалуйста, не стесняйтесь связываться, если у вас есть 
      какие-либо вопросы в это время!"
      
      Помните: аутентичность важнее совершенства скрипта. Используйте это как руководство, 
      но всегда будьте собой и искренне заботьтесь о помощи клиенту.
    duration_minutes: 30
    order: 2

  - id: "m3_l3"
    title: "Работа с возражениями с изяществом"
    type: "text"
    content: |
      Превращение возражений в возможности
      
      Возражения — это не отказы, это запросы на дополнительную информацию. Каждое возражение 
      — это возможность построить доверие и понимание.
      
      Распространённые возражения и ответы:
      
      1. "Это слишком дорого"
         Понять: Каков их бюджет? С чем они сравнивают?
         Ответ: "Я понимаю, бюджет важен. Позвольте мне помочь вам увидеть ценность и 
         изучить варианты, которые могут лучше подойти вам. Какие конкретные опасения у вас 
         есть относительно инвестиций?"
      
      2. "Мне нужно подумать об этом"
         Понять: Что конкретно требует рассмотрения? Что их удерживает?
         Ответ: "Абсолютно, это важное решение. Чтобы помочь вам в размышлениях, какая 
         конкретная информация вам нужна?"
      
      3. "Я работаю с другим поставщиком"
         Понять: Насколько они довольны? Что заставило бы их рассмотреть переход?
         Ответ: "Это здорово, что у вас есть поставщик. Мне любопытно, что заставило вас 
         обратиться к нам? Возможно, мы можем предложить что-то дополнительное или другое?"
      
      4. "Сейчас не подходящее время"
         Понять: Когда было бы подходящее время? Что должно измениться?
         Ответ: "Я ценю вашу прямоту о времени. Что должно произойти, чтобы это стало 
         приоритетом? Я бы хотел оставаться на связи и связаться, когда время будет лучше."
      
      5. "У меня нет полномочий решать"
         Понять: У кого есть? Каков процесс принятия решений?
         Ответ: "Я понимаю. Кто ещё должен быть вовлечён в этот разговор? 
         Я буду рад предоставить информацию, которой вы можете поделиться с лицами, принимающими 
         решения, или мы можем запланировать звонок вместе."
      
      Фреймворк Ч.Ч.О.Д. для возражений:
      
      Ч - Чувствую: "Я понимаю, как вы чувствуете..."
      Ч - Чувствовали: "Другие чувствовали то же самое..."
      О - Опыт: "То, что они испытали, было..."
      Д - Давайте: "Давайте исследуем, как это может сработать для вас..."
      
      Ключевые принципы:
      - Никогда не спорьте и не защищайтесь
      - Признайте их опасение как обоснованное
      - Задавайте вопросы для более глубокого понимания
      - Предоставляйте информацию, а не давление
      - Знайте, когда изящно отступить
      
      Помните: некоторые возражения невозможно преодолеть, и это нормально. Наша репутация 
      быть уважительными и понимающими ценнее любой отдельной продажи.
      
      Техника мягких допродаж 1→1.5→4:
      Начните с одной песни, предложите полторы (песня + фото), затем покажите ценность 
      пакета из 4 песен. Всегда фокусируйтесь на потребностях клиента, а не на размере чека.
    duration_minutes: 30
    order: 3

tests:
  - id: "m3_test1"
    title: "Тест по воронке продаж"
    passing_score: 80
    questions:
      - id: "q1"
        type: "single"
        question: "Что такое S0 в воронке продаж?"
        options:
          - "Первый контакт с клиентом"
          - "Лид создан / новый лид"
          - "Отправка демо"
          - "Финальный платёж"
        correct_index: 1

      - id: "q2"
        type: "single"
        question: "Что вы должны делать БОЛЬШЕ ВСЕГО во время первого контакта?"
        options:
          - "Говорить обо всех наших продуктах"
          - "Немедленно закрыть продажу"
          - "Слушать больше, чем говорить"
          - "Отправить их на сайт"
        correct_index: 2

      - id: "q3"
        type: "single"
        question: "Когда клиент говорит 'Это слишком дорого', что вы должны сделать сначала?"
        options:
          - "Немедленно предложить скидку"
          - "Сказать, что конкуренты дороже"
          - "Понять их бюджет и опасения"
          - "Завершить разговор"
        correct_index: 2

      - id: "q4"
        type: "single"
        question: "Что представляет S9 в воронке продаж?"
        options:
          - "Первый контакт установлен"
          - "Предложение отправлено"
          - "Закрыто/Выиграно / Успешное завершение"
          - "Фаза переговоров"
        correct_index: 2

      - id: "q5"
        type: "single"
        question: "Какой самый важный принцип при работе с возражениями?"
        options:
          - "Всегда предлагать скидку"
          - "Никогда не спорить и не защищаться"
          - "Давить на них, чтобы они решили быстро"
          - "Перейти к другому клиенту"
        correct_index: 1
